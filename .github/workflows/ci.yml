name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
      - name: Check source conventions
        if: matrix.python-version == '3.12'
        run: uv run pre-commit run --all-files
      - name: Build API documentation
        if: matrix.python-version == '3.12'
        run: uv run --locked --group docs python -m sphinx -b html -W --keep-going docs docs/_build/html
