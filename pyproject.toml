[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nalp"
version = "3.0.1"
description = "Natural Adversarial Language Processing"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Gustavo Rosa", email = "gustavo.rosa@unesp.br" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "gensim>=4.4.0",
    "mido>=1.3.3",
    "numpy>=2.1.0",
    "tensorflow>=2.20.0",
]

[project.optional-dependencies]
tests = [
    "coverage>=7.10.0",
    "flake8>=7.3.0",
    "pytest>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/gugarosa/nalp"
Documentation = "https://nalp.readthedocs.io"
Issues = "https://github.com/gugarosa/nalp/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.0",
]
docs = [
    "sphinx>=8.2.3,<10",
]

[tool.setuptools.packages.find]
include = ["nalp*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
skip = ["nalp/models/generators/__init__.py"]

[tool.pytest.ini_options]
addopts = ["-v", "--durations=10"]
norecursedirs = ["build", "dist"]
